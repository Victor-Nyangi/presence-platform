name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: presence
          POSTGRES_PASSWORD: presence
          POSTGRES_DB: presence
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DB_URL: postgres://presence:presence@localhost:5432/presence?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }

      - name: Apply schema and assert invariants
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f db/001_schema.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f db/002_smoke_test.sql

      - name: Vet
        run: cd gateway && go vet ./...

      - name: Check formatting
        run: |
          cd gateway
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Unit tests
        run: cd gateway && go test -race ./...

      - name: Integration tests
        run: cd gateway && PRESENCE_TEST_DATABASE_URL="$DB_URL" go test -tags integration -p 1 ./...

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Host tests only: the ring buffer and signing logic are deliberately
      # free of Arduino headers so they can run without the ESP32 toolchain.
      # A signing-format change that breaks the golden vector fails here
      # rather than in the field.
      - name: Firmware host tests
        run: make firmware-test

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install openapi-spec-validator
      - run: python -c "import yaml;from openapi_spec_validator import validate;validate(yaml.safe_load(open('docs/openapi.yaml')))"

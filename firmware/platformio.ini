; PlatformIO project for the ESP32 presence terminal.
;
;   pio run                 build
;   pio run -t upload       flash over USB
;   pio device monitor      serial console
;
; The host-side tests (make firmware-test from the repo root) do not need any
; of this — they compile the portable logic with plain g++.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32@^6.9.0
board     = esp32dev
framework = arduino

monitor_speed  = 115200
upload_speed   = 921600
board_build.filesystem = littlefs

; -Os over -O2: this is a device that beeps and buffers, not a DSP. Flash
; headroom matters more, especially with two OTA partitions.
;
; FIRMWARE_VERSION is MAJOR.MINOR.PATCH only (a static_assert in main.cpp
; enforces it). Bump it for every release: terminals refuse any image that is
; not newer than what they run, and fwsign refuses to sign an image under a
; version other than the one it was built with.
build_flags =
    -Os
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -DFIRMWARE_VERSION=\"0.1.0\"

build_unflags = -std=gnu++11

; Monocypher (Ed25519 for OTA verification) is vendored in lib/monocypher,
; not fetched, so the bytes that verify firmware are pinned in this repo.
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.3
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.2.0

; Two app partitions so OTA can roll back. Without this an interrupted update
; bricks a terminal that may be a long drive away.
board_build.partitions = min_spiffs.csv

[env:esp32dev-debug]
extends   = env:esp32dev
build_type = debug
; Drop the inherited level before adding 5, or every translation unit warns
; that CORE_DEBUG_LEVEL is redefined. The effective level is 5 either way.
build_unflags =
    ${env:esp32dev.build_unflags}
    -DCORE_DEBUG_LEVEL=2
; PRESENCE_BENCH_SERIAL_OTA: accept OTA images over the USB serial port
; (firmware/tools/serial_ota.py) so the Ed25519 gate, downgrade check and
; rollback can be proven on a board. Same verification as the network path.
; The same flag compiles in BENCH-SECRET, which loads a `make seed` device
; secret into NVS (docs/wifi-provisioning.md). It must never reach the release
; env: tools/check_bench_only.py, run by `make firmware-test`, fails if it does.
; PRESENCE_OTA_CONFIRM_MS: a 2-minute confirm window instead of 10, so the
; rollback test on the bench does not take a quarter of an hour.
; PRESENCE_WIFI_PORTAL_MS: the same for the Wi-Fi setup window, and
; PRESENCE_WIFI_FALLBACK_MS for how long a saved network that cannot be joined
; is retried before the setup portal reopens (docs/wifi-provisioning.md).
build_flags =
    ${env:esp32dev.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DPRESENCE_BENCH_SERIAL_OTA
    -DPRESENCE_OTA_CONFIRM_MS=120000
    -DPRESENCE_WIFI_PORTAL_MS=120000
    -DPRESENCE_WIFI_FALLBACK_MS=60000
